[package]
name = "wiki"
version = "0.1.0"
edition = "2021"
description = "wiki.py-shaped CLI over llm-wiki-core — drop-in for the init/ingest/compile/query-prepare calls the skills make (issue #15)."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
llm-wiki = { path = "../llm-wiki" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
