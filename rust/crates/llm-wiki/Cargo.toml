[package]
name = "llm-wiki"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs4 = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
ureq = "3"
quick-xml = "0.37"
flate2 = "1"
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
rayon = "1"
tiny_http = "0.12"
regex = "1"

[dev-dependencies]
tempfile = "3"
